name: Docs Pipeline

# On every push to main that touches force-app/, regenerate technical docs + the
# changelog (deterministic, auto-committed), ask Claude to update the business/
# use-case docs for whatever changed (opened as a PR for review, not auto-merged),
# then build and publish the unified site to GitHub Pages.
#
# One-time setup before this will fully work:
#   1. Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions"
#   2. Settings -> Actions -> General -> Workflow permissions -> allow "Read and
#      write permissions", and check "Allow GitHub Actions to create and approve
#      pull requests" (needed for the business-doc PR step below).
#   3. Add a repo secret CLAUDE_CODE_OAUTH_TOKEN — generate it locally with
#      `claude setup-token` (requires a Claude Pro, Max, Team, or Enterprise plan;
#      this authenticates as your subscription, not a pay-per-token API key).
#      If this secret is absent, the business-doc step is skipped and everything
#      else still runs and deploys.

on:
  push:
    branches: [main]
    paths:
      - 'force-app/**'
      # docs/business/** matters too: the AI-authored business docs land on main via a
      # reviewed PR that touches ONLY docs/business/ — without this path the site never
      # rebuilds after that merge, so approved business docs would never appear on the
      # published site until the next unrelated force-app push.
      - 'docs/business/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: docs-pipeline
  cancel-in-progress: false

env:
  # ONE long-lived review branch for AI-authored business docs, instead of a new
  # docs-business-update-<run_number> branch every run. Per-run branches produced a
  # pull request per run (two were open at once, with overlapping content and drifting
  # slugs) and left a trail of stale branches. A single branch means one rolling PR
  # that each run updates.
  REVIEW_BRANCH: docs-business-updates
  # Publish the pending (not-yet-merged) AI pages to the site as well as putting them
  # up for review. They render with an "Auto-generated" pill because the pipeline
  # writes `verified: false`, so nothing is presented as reviewed — but the site is
  # never blank while a review sits in the queue. Set to 'false' to publish only
  # pages that have actually been merged into main.
  PUBLISH_PENDING_DOCS: 'true'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (full history, needed to diff force-app)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install pipeline dependencies
        working-directory: docs
        run: npm ci

      - name: Configure git identity for bot commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Regenerate technical docs (deterministic)
        run: node docs/scripts/extract-technical.js

      - name: Regenerate version history from git log (deterministic)
        run: node docs/scripts/generate-version-history.js

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Bring the not-yet-merged AI pages into the working tree BEFORE the AI step.
      #
      # AI pages live on a review branch until a human merges them, so main's
      # docs/business/ is empty until then. Every run therefore used to start from
      # nothing, which caused three separate problems:
      #   - reconciliation saw the recorded pages missing and regenerated all 25 of
      #     them, ~8.5 minutes of model time, every single run;
      #   - the planner could not see the existing pages, so slugs drifted between
      #     runs (lead-capture-and-qualification -> lead-capture-scoring-assignment)
      #     and each run opened ANOTHER pull request instead of updating one;
      #   - the site built from main and published an empty business section.
      # Restoring the pending pages first makes the working tree "main + pending",
      # which fixes all three: the cache hits, the planner updates in place, and the
      # deploy has real content.
      - name: Restore pending AI business docs from the review branch
        id: pending
        run: |
          BRANCH="${{ env.REVIEW_BRANCH }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch --force origin "$BRANCH:refs/remotes/origin/$BRANCH"
            git checkout "origin/$BRANCH" -- docs/business
            echo "Restored $(git status --porcelain -- docs/business | wc -l) pending page(s) from $BRANCH."
          else
            echo "No review branch yet — starting from main's docs/business."
          fi

      - name: Warn early if the Claude token secret is missing
        if: env.CLAUDE_CODE_OAUTH_TOKEN == ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "::warning::CLAUDE_CODE_OAUTH_TOKEN secret is not set — the AI business-doc step below will be"
          echo "::warning::SKIPPED and docs/business/ will stay as-is (this is why the site's business/use-case"
          echo "::warning::section can be empty). Generate a token locally with 'claude setup-token' and add it"
          echo "::warning::under Settings -> Secrets and variables -> Actions -> New repository secret."

      - name: Ask Claude to update business docs for what changed
        timeout-minutes: 45   # backstop: the step reports and moves on rather than hanging a runner
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 'sonnet' is an alias that always resolves to the LATEST Sonnet-family
          # model (Sonnet 5 today, auto-upgrading when a newer Sonnet ships) —
          # instead of inheriting the subscription plan's default, which varies by
          # plan and may be Opus (slower, heavier on plan usage) on Max. Pin a full
          # ID (e.g. claude-sonnet-5) here instead if you ever need frozen,
          # reproducible output over auto-upgrades.
          ANTHROPIC_MODEL: sonnet
          # How many `claude -p` processes run at once. The authoring stage is one
          # call per PAGE and pages are disjoint files, so this is safe to raise —
          # the practical ceiling is subscription rate limiting, where practitioners
          # report intermittent 429s past ~5-6 concurrent sessions. Retries with
          # backoff handle the occasional one; raise this for a big backfill.
          DOCS_AI_CONCURRENCY: '4'
          # Keep the CLI from spending time on things a CI run never benefits from.
          DISABLE_AUTOUPDATER: '1'
          DISABLE_TELEMETRY: '1'
          DISABLE_ERROR_REPORTING: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: node docs/scripts/author-business-docs.mjs

      - name: Open a PR for any AI-authored business-doc changes
        id: business_pr
        continue-on-error: true  # a failed PR (e.g. permissions not yet set up) must never block the
                                  # deploy below — the deploy uses this run's freshly-built docs/site/
                                  # regardless of whether this push succeeded.
        run: |
          BRANCH="${{ env.REVIEW_BRANCH }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          if [ -z "$(git status --porcelain -- docs/business)" ]; then
            # Nothing differs from main. Either the AI made no changes, or a previous
            # review has since been merged so the pending pages now match main.
            echo "No business-doc changes to review."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Rebuild the review branch from current main plus this run's docs/business.
          # Force-push: the branch is a snapshot of "what review is pending", not a
          # history to preserve, and an open PR picks the update up automatically.
          git switch -c "$BRANCH"
          git add docs/business
          git commit -m "docs: AI-updated business documentation

          Regenerated from ${{ github.sha }}. Review before merging — this is the one
          layer of the pipeline an LLM writes prose for."
          git push --force origin "$BRANCH"

          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$EXISTING" ]; then
            echo "Updated existing PR #$EXISTING (branch $BRANCH)."
            echo "opened=true" >> "$GITHUB_OUTPUT"
          elif gh pr create --base main --head "$BRANCH" \
            --title "docs: business documentation (AI-drafted, rolling)" \
            --body "Auto-generated by the docs pipeline. This is a **rolling** pull request — each run force-pushes the latest AI-drafted business docs onto \`$BRANCH\`, so review the current diff rather than individual commits. Everything else in the pipeline is deterministic; this is the one AI-authored layer. Merging it publishes these pages as reviewed content and stops the pipeline regenerating them each run."; then
            echo "Opened the rolling PR for $BRANCH."
            echo "opened=true" >> "$GITHUB_OUTPUT"
          else
            # Usually: Settings -> Actions -> General -> "Allow GitHub Actions to create
            # and approve pull requests" is off. The branch IS pushed, so surface the
            # one-click compare URL rather than losing the work.
            echo "opened=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not open the PR automatically (usually: Settings -> Actions -> General ->"
            echo "::warning::'Allow GitHub Actions to create and approve pull requests' is disabled). The branch"
            echo "::warning::$BRANCH is pushed — open it manually here:"
            echo "::warning::${{ github.server_url }}/${{ github.repository }}/compare/main...$BRANCH?expand=1"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # MUST run even if the step above failed. Previously the "switch back to main"
      # lines lived at the end of that step, so when `gh pr create` failed under
      # `set -e` they never ran — the job stayed on the docs branch, which meant the
      # unreviewed AI pages got built and DEPLOYED, and the facts commit below landed
      # on the wrong branch (its `git push origin main` reported "Everything
      # up-to-date", silently losing the changelog and progress state).
      - name: Return to main (keeping the pending pages in the tree so the site is not blank)
        if: always()
        run: |
          git switch main

          # THIS is what published an empty business section even on a fully successful
          # run: the pages were committed to the review branch, this step reset
          # docs/business back to main (where there are none), and build-site.js then
          # logged "Built 0 business page(s)". Review gating the REPOSITORY is correct;
          # blanking the SITE while a review is pending is not.
          #
          # So by default keep the pending pages in the working tree for the build. They
          # carry `verified: false`, which the site renders as an "Auto-generated" pill,
          # so nothing is presented as reviewed. They are never committed to main here —
          # the facts commit below stages only docs/technical, docs/CHANGELOG.md,
          # docs/_state and the screenshot manifest.
          # Prefer the branch this run just built; fall back to the remote branch so a
          # run whose PR step exited early (nothing new to review) still publishes the
          # pages already waiting there instead of wiping them from the build.
          BRANCH="${{ steps.business_pr.outputs.branch }}"
          REF=""
          if [ -n "$BRANCH" ]; then
            if git rev-parse --verify "$BRANCH" >/dev/null 2>&1; then REF="$BRANCH"
            elif git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then REF="origin/$BRANCH"
            fi
          fi
          if [ "${{ env.PUBLISH_PENDING_DOCS }}" = "true" ] && [ -n "$REF" ]; then
            git checkout "$REF" -- docs/business
            echo "Publishing $(git status --porcelain -- docs/business | wc -l) pending page(s) from $REF to the site (marked Auto-generated)."
            if [ "${{ steps.business_pr.outputs.opened }}" != "true" ]; then
              echo "::warning::No pull request is open for $BRANCH, so these pages are published but unreviewed."
              echo "::warning::Open it here: ${{ github.server_url }}/${{ github.repository }}/compare/main...$BRANCH?expand=1"
            fi
          else
            # Strict mode (PUBLISH_PENDING_DOCS=false): publish only merged content.
            git checkout HEAD -- docs/business
            git clean -fd docs/business
          fi
          echo "On branch: $(git rev-parse --abbrev-ref HEAD)"
          git status --short -- docs/business | head -30

      - name: Generate changelog from the metadata diff (deterministic)
        run: node docs/scripts/generate-changelog.js

      - name: Build the unified site
        run: node docs/scripts/build-site.js

      - name: Commit regenerated technical docs and changelog
        id: commit_facts
        continue-on-error: true  # IMPORTANT: never let a failed push (e.g. branch protection, or repo
                                  # permissions not yet set to "Read and write" — see the setup notes at
                                  # the top of this file) block the deploy step below. docs/site/ was
                                  # already built from this run's fresh data regardless of whether this
                                  # commit lands, so the live site must still get the correct content —
                                  # only the *committed source* would be a push behind, and it self-heals
                                  # on the very next push once permissions are fixed.
        run: |
          # Assert we're on main before committing: a stray branch here is how the
          # regenerated facts silently stopped reaching main (see the restore step above).
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$BRANCH" != "main" ]; then
            echo "::error::Expected to be on main but am on '$BRANCH' — refusing to commit regenerated docs to the wrong branch."
            exit 1
          fi
          git add docs/technical docs/CHANGELOG.md docs/_state docs/screenshot-manifest.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(docs): regenerate technical docs and changelog [skip ci]"
            git push origin main
          fi

      - name: Warn if the facts commit failed
        if: steps.commit_facts.outcome == 'failure'
        run: |
          echo "::warning::Committing docs/technical + docs/CHANGELOG.md back to main FAILED — the site below"
          echo "::warning::still deploys with this run's correct data, but the repo's committed copy is now"
          echo "::warning::one push behind. This is almost always a permissions problem: Settings -> Actions ->"
          echo "::warning::General -> Workflow permissions -> 'Read and write permissions'. Fix it and the next"
          echo "::warning::push to force-app/ will catch the repo back up automatically."

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload docs/site as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
