# =============================================================================
# Secretless Salesforce documentation screenshot capture
# (CumulusCI + Robot Framework SalesforcePlaywright)
# =============================================================================
#
# Reads docs/screenshot-manifest.json (generated from the ```screenshot blocks in
# docs/business/**/*.md) and captures every entry against a real org:
#   - entries with an `actions:` list are replayed as real UI interactions
#     (App Launcher opened, search typed, New clicked, ...) so each image depicts
#     the exact documented step;
#   - entries with only a url_pattern are captured by direct navigation.
# Every capture waits until the page is FULLY rendered (spinners AND Lightning's
# grey stencil skeletons gone) before shooting.
#
# It uses NO GitHub Secrets. The Salesforce access token is pasted by the
# operator at trigger time as a workflow_dispatch input and lives only for the
# duration of the run. The only thing this workflow ever commits is docs/images/.
#
# >>> SECURITY CAVEAT — THE ORIGINAL ASSUMPTION HERE IS NO LONGER TRUE <<<
# workflow_dispatch inputs (including `access_token`) are recorded in the run
# history in CLEARTEXT. This was documented as acceptable because "the repository
# is private / single-maintainer" — but THIS REPOSITORY IS PUBLIC, so every run's
# log is world-readable and the pasted token is exposed to anyone, not just the
# person who minted it. `::add-mask::` cannot prevent this: the runner prints a
# step's script body and its `env:` values before the step executes, so the token
# is already on screen by the time the mask is registered.
#
# What still limits the damage: the token is short-lived (~2h Salesforce session
# timeout) and the `always()` logout step revokes it at the end of every run.
#
# To close it properly, pick ONE:
#   (a) store the token as a repo Secret (secrets are masked everywhere and never
#       printed) and read it via `secrets.SF_ACCESS_TOKEN` — this gives up the
#       "paste it at dispatch time" ergonomics that motivated the original design;
#   (b) make the repository private, which restores the original assumption; or
#   (c) knowingly accept public exposure of a 2-hour, self-revoking credential.
# Until one is chosen, treat every token pasted into this workflow as burned.
# =============================================================================

name: SF Screenshots

# workflow_dispatch only. No push / pull_request triggers, so this
# pasted-credential workflow can never be started by inbound/forked PRs.
on:
  workflow_dispatch:
    inputs:
      access_token:
        description: "Salesforce org access token (mint locally: sf org display -o <alias>)"
        required: true
        type: string
      instance_url:
        description: "My Domain / instance URL for the org"
        required: true
        type: string
        default: "https://login.salesforce.com"
      recapture:
        description: "Overwrite screenshots that already exist"
        required: false
        type: boolean
        default: false

# Least privilege: contents:write to commit docs/images/ via the auto-issued
# GITHUB_TOKEN; actions:write only to trigger the docs-pipeline run at the end
# so GitHub Pages redeploys with the new images.
permissions:
  contents: write
  actions: write

# Serialize runs so two dispatches cannot race the docs/images commit.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Third-party actions pinned to full commit SHAs.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 22 (LTS) is required: the Salesforce CLI bundles undici 8.0.3, which
      # calls worker_threads.markAsUncloneable — an API added in v22.10.0 and NOT
      # backported to Node 20. On Node 20 the CLI crashes at `sf org login` with
      # "webidl.util.markAsUncloneable is not a function" (nodejs/undici#5024).
      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: docs/capture/requirements.txt

      - name: Install Salesforce CLI (if missing)
        run: |
          if command -v sf >/dev/null 2>&1; then
            echo "sf already present: $(sf --version)"
          else
            npm install --global @salesforce/cli
            echo "installed: $(sf --version)"
          fi

      - name: Install CumulusCI + Robot Browser library
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/capture/requirements.txt
          # Installs the Playwright browser binaries (and their OS deps) that the
          # Robot Browser library drives.
          rfbrowser init chromium

      # ---------------------------------------------------------------------
      # Auth. add-mask is the FIRST line so the token is scrubbed from any later
      # accidental echo. The token reaches the CLI ONLY through the step-scoped
      # env var SF_ACCESS_TOKEN (never interpolated into the script body);
      # --no-prompt makes the CLI read SF_ACCESS_TOKEN. No set -x, no --verbose.
      # ---------------------------------------------------------------------
      - name: Authenticate to Salesforce
        id: auth
        env:
          SF_ACCESS_TOKEN: ${{ inputs.access_token }}
          SF_INSTANCE_URL: ${{ inputs.instance_url }}
        run: |
          # Mask via the env var below. NEVER write the inputs.access_token expression
          # anywhere in this script body, INCLUDING IN A COMMENT: the runner echoes the
          # whole body after expanding expressions, so even a commented-out reference is
          # printed in cleartext. That is what happened on 2026-07-28 (the login line)
          # and again on 2026-07-29 (this very comment).
          echo "::add-mask::$SF_ACCESS_TOKEN"
          sf org login access-token \
            --no-prompt \
            --instance-url "$SF_INSTANCE_URL" \
            --alias screenshotOrg \
            --set-default

      # Verify without leaking: jq selects only non-sensitive fields; the raw
      # (token-bearing) JSON is never printed.
      - name: Verify session (redacted)
        id: verify
        run: |
          sf org display --target-org screenshotOrg --json \
            | jq '{username: .result.username, instanceUrl: .result.instanceUrl, connectedStatus: .result.connectedStatus}'

      # Regenerate the screenshot manifest from the CURRENT business docs so the
      # capture never runs against a stale committed manifest.
      - name: Refresh screenshot manifest
        id: manifest
        working-directory: docs
        run: |
          npm ci
          node scripts/build-site.js

      # Hand CumulusCI the org directly instead of `cci org import`.
      #
      # `cci org import` reads the org out of the Salesforce CLI by parsing
      # `sf org display --json` and taking .result.accessToken. Modern sf CLI (2.144)
      # REDACTS that field, returning the literal string
      #     [REDACTED] Use 'sf org auth show-access-token' to view
      # CumulusCI then uses that placeholder as the access token AND derives the org
      # id from it via accessToken.split("!")[0] (sfdx_org_config.py:57). With no "!"
      # in the placeholder the whole sentence became the org id, which is exactly the
      # URL in the failing run:
      #     /sobjects/Organization/%5BREDACTED%5D%20Use%20'sf%20org%20auth%20...
      # and the bogus Authorization header produced INVALID_AUTH_HEADER.
      #
      # CumulusCI's supported CI escape hatch is CUMULUSCI_ORG_<name> holding a JSON
      # org config, which loads as a plain OrgConfig. We already have the real token
      # (it was pasted at dispatch), so we never need the CLI to hand it back.
      # Only non-redacted fields are read from the CLI.
      - name: Build the CumulusCI org config from the pasted token
        id: org_config
        env:
          SF_ACCESS_TOKEN: ${{ inputs.access_token }}
        run: |
          INFO="$(sf org display --target-org screenshotOrg --json)"
          INSTANCE_URL="$(printf '%s' "$INFO" | jq -r '.result.instanceUrl' | sed 's:/*$::')"
          USERNAME="$(printf '%s' "$INFO" | jq -r '.result.username')"
          # Same derivation CumulusCI uses — the org id is the part of a real
          # access token before the "!".
          ORG_ID="${SF_ACCESS_TOKEN%%!*}"
          if [ -z "$ORG_ID" ] || [ "$ORG_ID" = "$SF_ACCESS_TOKEN" ]; then
            echo "::error::The pasted access token has no '!' separator, so no org id can be derived from it."
            echo "::error::Mint a fresh one with: sf org display --target-org <alias> --json | jq -r .result.accessToken"
            exit 1
          fi
          echo "Org config: username=$USERNAME instanceUrl=$INSTANCE_URL orgId=$ORG_ID"
          # Single-line JSON; the token value is already registered with add-mask, so
          # it stays masked wherever this env var surfaces.
          echo "CUMULUSCI_ORG_ci=$(jq -cn \
            --arg t "$SF_ACCESS_TOKEN" --arg u "$INSTANCE_URL" --arg n "$USERNAME" --arg i "$ORG_ID" \
            '{access_token:$t, instance_url:$u, username:$n, org_id:$i}')" >> "$GITHUB_ENV"

      # NOTE: run from the repository ROOT, not docs/capture. CumulusCI finds its
      # project by walking up to the git repo root for cumulusci.yml — the working
      # directory is irrelevant. Pointing this step at docs/capture is what made the
      # 2026-07-28 run fail with "The file cumulusci.yml was not found in the repo
      # root ... Are you in a CumulusCI Project directory?".
      - name: Capture screenshots
        id: capture
        env:
          RECAPTURE: ${{ inputs.recapture }}
          # An access-token login has no refresh token, so CumulusCI's OAuth refresh
          # cannot work. This makes it use the token as supplied (org_config.py:97).
          CUMULUSCI_DISABLE_REFRESH: '1'
        run: |
          if [ "$RECAPTURE" = "true" ]; then
            cci task run capture_docs --org ci -o vars FORCE:True
          else
            cci task run capture_docs --org ci
          fi

      # Revoke the runner-side session no matter what happened above
      # (success, failure, or cancellation).
      - name: Logout (revoke session)
        if: always()
        run: sf org logout --target-org screenshotOrg --no-prompt || true

      # The ONLY thing this workflow ever writes back to the repository is
      # docs/images/ — never scripts, never site output, never metadata.
      - name: Commit screenshots
        id: commit
        run: |
          git config user.name "sf-screenshots-bot"
          git config user.email "sf-screenshots-bot@users.noreply.github.com"
          git add docs/images
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "docs(screenshots): refresh captured Salesforce screenshots [skip ci]"
            git push
          fi

      # Redeploy GitHub Pages with the new images (docs-pipeline's push trigger
      # only watches force-app/**, so an images-only commit wouldn't rebuild it).
      - name: Trigger docs pipeline for Pages redeploy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs-pipeline.yml --ref "${GITHUB_REF_NAME}"

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sf-screenshots
          path: docs/images
          if-no-files-found: warn

      # Robot Framework's own log/report — the first place to look when a
      # capture fails or a selector drifts.
      - name: Upload Robot Framework results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: robot-results
          path: docs/capture/robot/DocsProject/results
          if-no-files-found: ignore

      # One short summary on the run page: what succeeded, what failed, what needs a
      # human's attention. Both prior failures were a single line hidden under a
      # 2,000-line pip install, which is exactly what this exists to surface.
      # Runs on always() so a failed capture still gets reported.
      - name: Report
        if: always()
        env:
          STEP_OUTCOMES: >-
            {"Authenticate to Salesforce":"${{ steps.auth.outcome }}",
             "Verify session":"${{ steps.verify.outcome }}",
             "Refresh screenshot manifest":"${{ steps.manifest.outcome }}",
             "Build CumulusCI org config":"${{ steps.org_config.outcome }}",
             "Capture screenshots":"${{ steps.capture.outcome }}",
             "Commit screenshots":"${{ steps.commit.outcome }}"}
        run: node docs/capture/report.mjs
